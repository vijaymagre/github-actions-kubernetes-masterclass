
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Deploy enabled: ${{ vars.DEPLOY_ENABLED }}"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Deploy to EC2
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
          }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            REPO="$HOME/github-actions-kubernetes-masterclass"

            if [ ! -d "$REPO/.git" ]; then
              git clone "${{ github.server_url }}/${{ github.repository }}.git" "$REPO"
            fi

            cd "$REPO"
            git pull origin main

            if [ ! -f .env ]; then
              echo "ERROR: .env file is missing"
              exit 1
            fi

            docker compose pull
            docker compose up -d
            docker compose ps
